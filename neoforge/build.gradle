plugins {
    id 'com.github.johnrengelman.shadow'
    id "org.jetbrains.kotlin.jvm" version "2.2.20"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

// based of https://docs.architectury.dev/loom/datagen
loom {
    runs {
        data {
            data()
            programArgs "--all", "--mod", "$mod_id", "--output", generatedResources.absolutePath
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // see: https://github.com/thedarkcolour/KotlinForForge/issues/103
    implementation("thedarkcolour:kotlinforforge-neoforge:$rootProject.kotlin_for_forge_version") {
        exclude group: "net.neoforged.fancymodloader", module: "loader"
    }

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // Cobblemon
    modImplementation "com.cobblemon:neoforge:$rootProject.cobblemon_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:2.2.20"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // JGraphT
    implementation "org.jgrapht:jgrapht-core:$rootProject.jgrapht_version"
    implementation "org.jgrapht:jgrapht-ext:$rootProject.jgrapht_version"
    forgeRuntimeLibrary "org.jgrapht:jgrapht-core:$rootProject.jgrapht_version"
    forgeRuntimeLibrary "org.jgrapht:jgrapht-ext:$rootProject.jgrapht_version"
    include "org.jgrapht:jgrapht-core:$rootProject.jgrapht_version"
    include "org.jgrapht:jgrapht-ext:$rootProject.jgrapht_version"

    // need to be bundled with the mod (neoforge only)
    implementation "com.github.vlsi.mxgraph:jgraphx:$rootProject.jgraphx_version"
    implementation "org.apfloat:apfloat:$rootProject.apfloat_version"
    implementation "org.jheaps:jheaps:$rootProject.jheaps_version"
    forgeRuntimeLibrary "com.github.vlsi.mxgraph:jgraphx:$rootProject.jgraphx_version"
    forgeRuntimeLibrary "org.apfloat:apfloat:$rootProject.apfloat_version"
    forgeRuntimeLibrary "org.jheaps:jheaps:$rootProject.jheaps_version"
    include "com.github.vlsi.mxgraph:jgraphx:$rootProject.jgraphx_version"
    include "org.apfloat:apfloat:$rootProject.apfloat_version"
    include "org.jheaps:jheaps:$rootProject.jheaps_version"

    // Radical Cobblemon Trainers API
    modImplementation "curse.maven:radical-cobblemon-trainers-api-1152792:${rctapi_neoforge_version}"

    // Trainer Battle Commands (test, optional in production)
    modRuntimeOnly "curse.maven:tbcs-1172731:${tbcs_neoforge_version}"

    // Carry On (testing)
    // runtimeOnly "curse.maven:carry-on-274259:5649344"

    // runtimeOnly fg.deobf("curse.maven:simpletms-tms-and-trs-for-cobblemon-959184:${simpletms_version}")
    // runtimeOnly fg.deobf("curse.maven:pkgbadges-889895:${pkgbadges_version}")
    // runtimeOnly fg.deobf("curse.maven:patchouli-306770:${patchouli_version}")
    // runtimeOnly fg.deobf("curse.maven:cobblepedia-850946:${cobblepedia_version}")
    // runtimeOnly fg.deobf("curse.maven:configured-457570:${configured_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${jei_mc_version}-forge:${jei_version}")
}

tasks.named('runClient') {
    args '--username', 'Dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
