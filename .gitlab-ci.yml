stages:
  - prepare
  - test
  - metadata
  - build
  - release
  - publish

variables:
  MCCI_IMAGE: registry.gitlab.com/srcmc/templates/mcci:1.2
  TARGET_PLATFORMS: fabric,neoforge # fabric, neoforge or common (fabric+neoforge)
  TARGET_ENVIRONMENTS: Client,Server # either both or one of
  BOT_USERNAME: mcci # mostly a 'cosmetic' feature (only [a-zA-Z0-9_-])
  GFX_ENABLED: false # only enable this if there are runners available with GFX support (otherwise the pipeline will get stuck on client tests)

.candidate_branch: &candidate_branch $CI_COMMIT_BRANCH =~ /^rc\/v\d+\.\d+\.\d+(-\w+)?$/
.release_branch: &release_branch $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
.release_branch_common: &release_branch_common $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $TARGET_PLATFORMS =~ /common/
.release_branch_fabric: &release_branch_fabric $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $TARGET_PLATFORMS =~ /fabric/
.release_branch_neoforge: &release_branch_neoforge $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $TARGET_PLATFORMS =~ /neoforge/

.defaults: &defaults
  image: $MCCI_IMAGE
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  before_script:
    - cd $CI_PROJECT_DIR
    - git config user.name $BOT_USERNAME
    - git config user.email $BOT_USERNAME-noreply@narnia.bot
    - git lfs install
    - chmod +x gradlew

.defaults-cached: &defaults-cached
  <<: *defaults
  cache:
    key:
      files:
        - "**/gradle.properties"
        - "**/build.gradle"
      prefix: gradle-$CI_COMMIT_REF_SLUG
    policy: pull
    paths:
      - .gradle/
      - common/.gradle/
      - fabric/.gradle/
      - neoforge/.gradle/

release-candidate:
  <<: *defaults
  stage: prepare
  script: release-candidate
  rules:
    - if: *candidate_branch

refresh-dependencies:
  <<: *defaults
  stage: prepare
  cache:
    key:
      files:
        - "**/gradle.properties"
        - "**/build.gradle"
      prefix: gradle-$CI_COMMIT_REF_SLUG
    policy: pull-push
    paths:
      - .gradle/
      - common/.gradle/
      - fabric/.gradle/
      - neoforge/.gradle/
  script: ./gradlew --refresh-dependencies

unit-tests:
  <<: *defaults-cached
  stage: test
  script: ./gradlew test -x compileGameTestJava -x compileGameTestKotlin -x runGameTest # excludes game test

game-test:
  <<: *defaults-cached
  stage: test
  script: ./gradlew runGameTest

client-test:
  <<: *defaults-cached
  stage: test
  script: ./gradlew runClientGameTest
  rules:
    - if: $GFX_ENABLED == true
  tags:
    - gfx

update-metadata:
  <<: *defaults
  stage: metadata
  script: update-metadata
  rules:
    - if: *release_branch

build:
  <<: *defaults-cached
  artifacts:
    untracked: false
    when: on_success
    access: developer
    expire_in: 3d
    paths:
      - common/build/libs/*
      - fabric/build/libs/*
      - neoforge/build/libs/*
    exclude:
      - ./**/build/libs/*-transformProduction*.jar
      - ./**/build/libs/*-dev-shadow.jar
      - ./**/build/libs/*-sources.jar
  stage: build
  script: build-release
  rules:
    - if: *release_branch

release-version:
  <<: *defaults
  stage: release
  script: release-version
  rules:
    - if: *release_branch

.publish: &publish
  <<: *defaults
  stage: publish

.publish-common: &publish-common
  <<: *publish
  rules:
    - if: *release_branch_common

.publish-neoforge: &publish-neoforge
  <<: *publish
  rules:
    - if: *release_branch_neoforge

.publish-fabric: &publish-fabric
  <<: *publish
  rules:
    - if: *release_branch_fabric

publish-modrinth-common:
  <<: *publish-common
  script: publish-modrinth common

publish-modrinth-neoforge:
  <<: *publish-neoforge
  script: publish-modrinth neoforge
  needs:
    - job: publish-modrinth-common
      optional: true

publish-modrinth-fabric:
  <<: *publish-fabric
  script: publish-modrinth fabric
  needs:
    - job: publish-modrinth-common
      optional: true

publish-curseforge-common:
  <<: *publish-common
  script: publish-curseforge common

publish-curseforge-neoforge:
  <<: *publish-neoforge
  script: publish-curseforge neoforge
  needs:
    - job: publish-curseforge-common
      optional: true

publish-curseforge-fabric:
  <<: *publish-fabric
  script: publish-curseforge fabric
  needs:
    - job: publish-curseforge-common
      optional: true

workflow:
  rules: # Pipeline runs for commits on release-candidate or release-branches only.
    - if: *candidate_branch
    - if: *release_branch
    - if: $CI_COMMIT_TAG # TODO: auto delete "forbidden" tags (maybe)
      when: never
