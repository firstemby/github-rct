run:
  client:
    fabric: bash gradlew clean fabric:runClient --console=plain
    neoforge: bash gradlew clean neoforge:runClient --console=plain
  server:
    fabric: bash gradlew clean fabric:runServer --console=plain
    neoforge: bash gradlew clean neoforge:runServer --console=plain
generate:
  assets: bash tools/generate/assets
  textures: bash tools/generate/textures
  trainers: bash tools/generate/trainers
build: bash gradlew clean build --console=plain
copyto:
  fabric: version=$(grep "mod_version" "gradle.properties"); version="${version:12}"; cp "fabric/build/libs/rctmod-fabric-1.21.1-$version.jar" "$HOME/AppData/Roaming/ModrinthApp/profiles/RCT 1.21.1 Test (fabric)/mods"
  neoforge: version=$(grep "mod_version" "gradle.properties"); version="${version:12}"; cp "neoforge/build/libs/rctmod-neoforge-1.21.1-$version.jar" "$HOME/AppData/Roaming/ModrinthApp/profiles/RCT 1.21.1 Test (neoforge)/mods"
publish: inenv ./tools/publish
