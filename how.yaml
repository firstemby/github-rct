run:
  client:
    fabric: ./gradlew clean fabric:runClient
    neoforge: ./gradlew clean neoforge:runClient
  server:
    fabric: ./gradlew clean fabric:runServer
    neoforge: ./gradlew clean neoforge:runServer
generate:
  assets: ./tools/generate/assets
  textures: ./tools/generate/textures
  trainers: ./tools/generate/trainers
build: ./gradlew clean build
copyto:
  fabric: version=$(grep "mod_version" "gradle.properties"); version="${version:12}"; cp "fabric/build/libs/rctmod-fabric-1.21.1-$version.jar" "$HOME/.local/share/ModrinthApp/profiles/cbl-1.7.2-test/mods"
  neoforge: version=$(grep "mod_version" "gradle.properties"); version="${version:12}"; cp "neoforge/build/libs/rctmod-neoforge-1.21.1-$version.jar" "$HOME/.local/share/ModrinthApp/profiles/rctapi-neoforge-0.13.8/mods"
publish: inenv ./tools/publish
