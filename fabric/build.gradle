plugins {
    id 'com.github.johnrengelman.shadow'
    id "org.jetbrains.kotlin.jvm" version "2.2.20"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Cobblemon
    modImplementation "com.cobblemon:fabric:$rootProject.cobblemon_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:2.2.20"

    // Cobblemon dev dependencies
    modRuntimeOnly("org.graalvm.js:js:22.3.0")
    modRuntimeOnly("org.graalvm.sdk:graal-sdk:22.3.0")
    modRuntimeOnly("org.graalvm.regex:regex:22.3.0")
    modRuntimeOnly("org.graalvm.truffle:truffle-api:22.3.0")
    modRuntimeOnly("com.ibm.icu:icu4j:71.1")

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // JGraphT
    implementation "org.jgrapht:jgrapht-core:$rootProject.jgrapht_version"
    implementation "org.jgrapht:jgrapht-ext:$rootProject.jgrapht_version"
    include "org.jgrapht:jgrapht-core:$rootProject.jgrapht_version"
    include "org.jgrapht:jgrapht-ext:$rootProject.jgrapht_version"
    include "com.github.vlsi.mxgraph:jgraphx:$rootProject.jgraphx_version"

    // Forge Config Port
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${fcap_version}"

    // Radical Cobblemon Trainers API
    modImplementation "curse.maven:radical-cobblemon-trainers-api-1152792:${rctapi_fabric_version}"
    // modImplementation files("../tmp/libs/rctapi-fabric-1.21.1-${rctapi_min_version}.jar") // local test

    // Mod Menu (tests only)
    modRuntimeOnly "curse.maven:modmenu-308702:${modmenu_version}"

    // MaLiLib + LiteMatica (tests only)
    modRuntimeOnly "curse.maven:malilib-303119:${malilib_version}"
    modRuntimeOnly "curse.maven:litematica-308892:${litematica_version}"

    // Trainer Battle Commands (test, optional in production)
    modRuntimeOnly "curse.maven:tbcs-1172731:${tbcs_fabric_version}"

    // modRuntimeOnly "curse.maven:simpletms-tms-and-trs-for-cobblemon-959184:${simpletms_fabric_version}"
    // modRuntimeOnly "curse.maven:pkgbadges-889895:${pkgbadges_fabric_version}"
    // modRuntimeOnly "curse.maven:patchouli-fabric-393236:${patchouli_fabric_version}"
    // modRuntimeOnly "curse.maven:cobblepedia-850946:${cobblepedia_fabric_version}"
    // modRuntimeOnly "curse.maven:configured-457570:${configured_fabric_version}"
    // modRuntimeOnly "mezz.jei:jei-${jei_mc_version}-fabric:${jei_version}"
}

fabricApi {
	configureTests {
		createSourceSet = true
        clearRunDirectory = false // Default is true
        username = "Dev" // Default is Player0
		modId = "$rootProject.mod_id"
		enableGameTests = true // Default is true
		enableClientGameTests = true // Default is true
		eula = true // By setting this to true, you agree to the Minecraft EULA.
	}
}

processGametestResources {
    from project(":fabric").sourceSets.gametest.resources
    
    filesMatching(['**/*.mods.toml', 'pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand project.properties
    }
}

sourceSets {
    main {
        // resources.srcDir generatedResources
        resources {
            srcDirs generatedResources
            exclude '.cache'
        }
    }
}

tasks.named('runClient') {
    // Set the username here
    args '--username', 'Dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
